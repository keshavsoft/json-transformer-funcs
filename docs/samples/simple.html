<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Minimal Table Example</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">

  <script type="module">
    // 1. Imports
    import { tableFromData } from "./src/index.js";
    import buildSpecElement from "https://keshavsoft.github.io/json-to-tag/dist/v9/min.js";

    // 2. Read 3 Things
    import data from "./data.json" with { type: "json" };
    import spec from "./spec.json" with { type: "json" };
    import table from "./table.json" with { type: "json" };

    // 3. Build Spec Tree
    const tableSpec = tableFromData({ inData: data, inSpec: spec, inTable: table });

    // 4. Build DOM with json-to-tag CDN & DOM it
    const tableElement = buildSpecElement(tableSpec);
    document.body.appendChild(tableElement);
  </script>

</body>
</html>
